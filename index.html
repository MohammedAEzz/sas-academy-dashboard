<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SAS Academy Analytics</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/main.css">
</head>
<body>
  <div class="app-shell">
    <header class="app-header">
      <div class="brand">
        <span class="brand-mark">SAS</span>
        <div>
          <h1>SAS Academy Analytics</h1>
          <p class="subtitle">Historical delivery &amp; feedback intelligence</p>
        </div>
      </div>
      <nav class="main-nav" id="main-nav" aria-label="Main navigation">
        <a href="#/overview" data-route="overview">Overview</a>
        <a href="#/groups" data-route="groups">Groups</a>
        <a href="#/instructors" data-route="instructors">Instructors</a>
        <a href="#/feedback" data-route="feedback">Feedback</a>
        <a href="#/programs" data-route="programs">Programs</a>
        <a href="#/forecast" data-route="forecast">Forecast &amp; Capacity</a>
      </nav>
      <div class="header-actions">
        <button class="theme-toggle" id="theme-toggle" aria-label="Toggle dark mode" title="Toggle theme">◐</button>
      </div>
    </header>

    <section class="filter-bar" id="filter-bar" aria-label="Global filters">
      <div class="filter-bar-inner">
        <button class="filter-toggle-mobile" id="filter-toggle-mobile" type="button">Filters ▾</button>
        <div class="filter-toolbar" id="filter-toolbar"></div>
      </div>
    </section>

    <main class="app-main" id="app">
      <div class="loading-state" id="loading-state">
        <div class="spinner"></div>
        <p>Loading analytics data…</p>
      </div>
    </main>

    <footer class="data-quality" id="data-quality"></footer>
  </div>

  <script src="assets/echarts.min.js"></script>
  <script type="module" src="js/app.js"></script>
</body>
</html>
